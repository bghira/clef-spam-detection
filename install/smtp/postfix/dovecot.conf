# Merge into Dovecot 2.3 configuration; preserve existing service listeners.
service lmtp {
  unix_listener clef-lmtp {
    user = clef-spam
    group = clef-spam
    mode = 0600
  }
}
# Only behind the trusted Clef header-stripping delivery path.
# Preserve existing sieve_before scripts and use the next numbered slot if set.
plugin {
  sieve_before = /etc/dovecot/sieve/clef-junk.sieve
}
